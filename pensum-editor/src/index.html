<!doctype html>
<html lang="hy">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Տնային աշխատանքի տետր</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <form class="editor" id="workbook-form">
      <div class="metadata">
        <div class="field field-full">
          <label for="workbook-title">Վերնագիր</label>
          <input id="workbook-title" name="title" type="text" required>
        </div>
        <div class="field">
          <label for="workbook-author">Հեղինակ</label>
          <input id="workbook-author" name="author" type="text" required>
        </div>
        <div class="field">
          <label for="workbook-date">Ստեղծման ամսաթիվ</label>
          <input id="workbook-date" name="created-at" type="date" required>
        </div>
      </div>

      <div class="assignments-heading">
        <h3>Առաջադրանքներ</h3>
        <button class="button button-primary add-assignment-button" id="add-assignment" type="button" aria-label="Ավելացնել առաջադրանք" title="Ավելացնել առաջադրանք">+</button>
      </div>
      <div class="assignment-list" id="assignment-list"></div>
      <p class="status" id="status" aria-live="polite"></p>
    </form>
  </main>

  <dialog class="settings-dialog" id="settings-dialog" aria-labelledby="settings-title">
    <form method="dialog">
      <h2 id="settings-title">Կարգավորումներ</h2>
      <div class="field">
        <label for="user-mode">Օգտվողի ռեժիմ</label>
        <select id="user-mode">
          <option value="teacher">Դասատու (teacher)</option>
          <option value="student">Աշակերտ (student)</option>
        </select>
      </div>
      <div class="settings-actions">
        <button class="button button-secondary" value="cancel">Չեղարկել</button>
        <button class="button button-primary" value="save">Պահպանել</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="./main.js"></script>
</body>
</html>
