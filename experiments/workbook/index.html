<!doctype html>
<html lang="hy">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Աշակերտական տետրերի ստեղծիչ</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #202b3c;
      background: #f3f6fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --blue: #3159c9;
      --blue-dark: #2346a8;
      --line: #dce3ee;
      --muted: #657187;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      margin: 0;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .topbar {
      padding: 28px max(24px, calc((100% - 1180px) / 2));
      color: white;
      background: linear-gradient(115deg, #263f85, #3159c9);
    }

    .topbar h1 {
      margin: 0;
      font-size: clamp(1.4rem, 3vw, 2rem);
    }

    .topbar p {
      margin: 8px 0 0;
      color: #dfe7ff;
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 24px;
      width: min(920px, calc(100% - 40px));
      margin: 28px auto 56px;
      align-items: start;
    }

    .editor {
      min-width: 0;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: white;
      box-shadow: 0 8px 26px rgb(34 54 93 / 6%);
    }

    h2,
    h3,
    h4,
    p {
      margin-top: 0;
    }

    h2 {
      margin-bottom: 18px;
      font-size: 1.25rem;
    }

    h3 {
      margin-bottom: 14px;
      font-size: 1.05rem;
    }

    h4 {
      margin-bottom: 12px;
      font-size: .98rem;
    }

    .metadata {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--line);
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field-full {
      grid-column: 1 / -1;
    }

    label,
    .field-label {
      font-size: .9rem;
      font-weight: 650;
    }

    input,
    textarea {
      width: 100%;
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid #cbd4e2;
      border-radius: 8px;
      color: inherit;
      background: white;
    }

    input:focus,
    textarea:focus,
    button:focus-visible {
      outline: 3px solid rgb(49 89 201 / 22%);
      outline-offset: 1px;
      border-color: var(--blue);
    }

    textarea {
      min-height: 84px;
      resize: vertical;
    }

    .assignments-heading,
    .assignment-heading,
    .section-heading,
    .block-heading,
    .output-heading,
    .grid-tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .assignments-heading {
      margin: 22px 0 14px;
    }

    .assignments-heading h3,
    .assignment-heading h4,
    .section-heading h4,
    .output-heading h2 {
      margin: 0;
    }

    .assignment-list,
    .assignment-sections,
    .block-list {
      display: grid;
      gap: 16px;
    }

    .assignment-card {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fbfcfe;
    }

    .assignment-heading {
      margin-bottom: 16px;
    }

    .assignment-sections {
      grid-template-columns: 1fr;
    }

    .content-section {
      min-width: 0;
      padding: 14px;
      border: 1px solid #e3e8f0;
      border-radius: 10px;
      background: white;
    }

    .section-heading {
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .add-block-tools {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .add-block-button {
      width: 52px;
      height: 52px;
      padding: 0;
      border: 1px solid #cbd4e2;
      border-radius: 50%;
      color: var(--blue);
      background: white;
      font-size: 1.25rem;
      font-weight: 750;
      box-shadow: 0 2px 5px rgb(34 54 93 / 10%);
    }

    .add-block-button:hover {
      border-color: var(--blue);
      background: #f1f5ff;
      box-shadow: 0 4px 9px rgb(34 54 93 / 16%);
    }

    .content-block {
      padding: 12px;
      border: 1px solid #e2e7ef;
      border-radius: 9px;
      background: #fbfcff;
    }

    .content-block-text {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .content-block-text textarea {
      flex: 1;
    }

    .content-block-squared {
      position: relative;
      padding-top: 44px;
    }

    .content-block-squared-remove {
      position: absolute;
      top: 10px;
      right: 10px;
    }

    .content-block-image {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .content-block-image-preview {
      flex: 1;
      width: 100%;
      max-height: 280px;
      border-radius: 6px;
      object-fit: contain;
      object-position: left top;
    }

    .block-heading {
      margin-bottom: 10px;
      color: var(--muted);
      font-size: .85rem;
      font-weight: 650;
    }

    .grid-tools {
      justify-content: flex-start;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .grid-tool-button {
      width: 28px;
      min-height: 28px;
      padding: 0;
      border-radius: 6px;
      font-size: 1rem;
      line-height: 1;
    }

    .grid-scroll {
      max-width: 100%;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .grid-row {
      display: contents;
    }

    .grid-row input {
      width: 6mm;
      min-width: 6mm;
      height: 6mm;
      min-height: 6mm;
      padding: 0;
      border: 0;
      border-right: 1px solid #cbd4e2;
      border-bottom: 1px solid #cbd4e2;
      border-radius: 0;
      background: white;
      text-align: center;
    }

    .button {
      display: inline-flex;
      min-height: 38px;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 8px 12px;
      border: 1px solid transparent;
      border-radius: 8px;
      font-weight: 650;
      transition: background .15s ease, border-color .15s ease;
    }

    .button-primary {
      color: white;
      background: var(--blue);
    }

    .button-primary:hover {
      background: var(--blue-dark);
    }

    .add-assignment-button {
      width: 40px;
      min-height: 40px;
      padding: 0;
      border-radius: 50%;
      font-size: 1.35rem;
      line-height: 1;
    }

    .button-secondary {
      color: #34425b;
      border-color: #cbd4e2;
      background: white;
    }

    .button-secondary:hover {
      border-color: #8d9bb2;
      background: #f6f8fc;
    }

    .button-danger {
      color: #a3313a;
      border-color: #f0cbd0;
      background: #fff7f8;
    }

    .button-danger:hover {
      background: #ffedef;
    }

    .button-small {
      min-height: 32px;
      padding: 5px 9px;
      font-size: .83rem;
    }

    .remove-block-button {
      width: 28px;
      min-height: 28px;
      padding: 0;
      border-radius: 50%;
      font-size: 1rem;
      line-height: 1;
    }

    .button:disabled {
      cursor: not-allowed;
      opacity: .5;
    }

    .status {
      color: var(--muted);
      font-size: .9rem;
      line-height: 1.5;
    }

    .status {
      min-height: 22px;
      margin: 12px 0 0;
    }

    .status-error {
      color: #a3313a;
    }

    .status-success {
      color: #24744d;
    }

    @media (max-width: 860px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      main {
        width: min(100% - 24px, 520px);
        margin-top: 16px;
      }

      .topbar {
        padding: 22px 16px;
      }

      .editor {
        padding: 17px;
      }

      .metadata,
      .assignment-sections {
        grid-template-columns: 1fr;
      }

      .field-full {
        grid-column: auto;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>Աշակերտական տետրի ստեղծիչ</h1>
    <p>Լրացրու տետրի տվյալները, ավելացրու առաջադրանքներ և ներբեռնիր JSON փաստաթուղթը։</p>
  </header>

  <main>
    <form class="editor" id="workbook-form">
      <div class="metadata">
        <div class="field field-full">
          <label for="workbook-title">Վերնագիր</label>
          <input id="workbook-title" name="title" type="text" required>
        </div>
        <div class="field">
          <label for="workbook-author">Հեղինակ</label>
          <input id="workbook-author" name="author" type="text" required>
        </div>
        <div class="field">
          <label for="workbook-date">Ստեղծման ամսաթիվ</label>
          <input id="workbook-date" name="created-at" type="date" required>
        </div>
      </div>

      <div class="assignments-heading">
        <h3>Առաջադրանքներ</h3>
        <button class="button button-primary add-assignment-button" id="add-assignment" type="button" aria-label="Ավելացնել առաջադրանք" title="Ավելացնել առաջադրանք">+</button>
      </div>
      <div class="assignment-list" id="assignment-list"></div>
      <button class="button button-primary" type="submit">Ստեղծել և ներբեռնել JSON-ը</button>
      <p class="status" id="status" aria-live="polite">Լրացրու պարտադիր դաշտերը, ապա ստեղծիր և ներբեռնիր JSON փաստաթուղթը։</p>
    </form>
  </main>

  <script>
    const form = document.querySelector("#workbook-form");
    const assignmentList = document.querySelector("#assignment-list");
    const status = document.querySelector("#status");

    function makeButton(text, className, onClick, type = "button") {
      const button = document.createElement("button");
      button.type = type;
      button.className = className;
      button.textContent = text;
      if (onClick) button.addEventListener("click", onClick);
      return button;
    }

    function updateAssignmentNumbers() {
      assignmentList.querySelectorAll(".assignment-card").forEach((card, index) => {
        card.querySelector(".assignment-number").textContent = `Առաջադրանք ${index + 1}`;
      });
    }

    function createGridCell(rowIndex, columnIndex) {
      const input = document.createElement("input");
      input.type = "text";
      input.maxLength = 1;
      input.autocomplete = "off";
      input.setAttribute("aria-label", `Տող ${rowIndex + 1}, վանդակ ${columnIndex + 1}`);
      input.addEventListener("input", () => {
        if (!input.value) return;
        const cells = [...input.closest(".grid-editor").querySelectorAll("input")];
        cells[cells.indexOf(input) + 1]?.focus();
      });
      return input;
    }

    function createSquaredEditor() {
      const editor = document.createElement("div");
      const scroll = document.createElement("div");
      scroll.className = "grid-scroll";
      const grid = document.createElement("div");
      grid.className = "grid-editor";
      grid.style.display = "grid";
      grid.style.width = "max-content";
      grid.style.borderTop = "1px solid #cbd4e2";
      grid.style.borderLeft = "1px solid #cbd4e2";
      let columnCount = 20;

      function addRow(values = []) {
        const row = document.createElement("div");
        row.className = "grid-row";
        row.setAttribute("role", "row");
        for (let column = 0; column < columnCount; column += 1) {
          const cell = createGridCell(grid.children.length, column);
          cell.value = values[column] || "";
          cell.setAttribute("role", "gridcell");
          row.append(cell);
        }
        grid.append(row);
      }

      grid.style.gridTemplateColumns = `repeat(${columnCount}, 6mm)`;
      grid.setAttribute("role", "grid");
      for (let row = 0; row < 15; row += 1) addRow();
      scroll.append(grid);

      const tools = document.createElement("div");
      tools.className = "grid-tools";
      tools.append(
        makeButton("+Տ", "button button-secondary grid-tool-button", () => addRow()),
        makeButton("−Տ", "button button-secondary grid-tool-button", () => {
          if (grid.children.length > 1) grid.lastElementChild.remove();
        }),
        makeButton("+Ս", "button button-secondary grid-tool-button", () => {
          columnCount += 1;
          grid.style.gridTemplateColumns = `repeat(${columnCount}, 6mm)`;
          grid.querySelectorAll(".grid-row").forEach((row, rowIndex) => {
            const cell = createGridCell(rowIndex, row.children.length);
            cell.setAttribute("role", "gridcell");
            row.append(cell);
          });
        }),
        makeButton("−Ս", "button button-secondary grid-tool-button", () => {
          const rows = [...grid.querySelectorAll(".grid-row")];
          if (columnCount > 1) {
            columnCount -= 1;
            grid.style.gridTemplateColumns = `repeat(${columnCount}, 6mm)`;
            rows.forEach(row => row.lastElementChild.remove());
          }
        })
      );
      ["Ավելացնել տող", "Հեռացնել վերջին տողը", "Ավելացնել սյուն", "Հեռացնել վերջին սյունը"]
        .forEach((label, index) => {
          tools.children[index].setAttribute("aria-label", label);
          tools.children[index].title = label;
        });
      editor.append(scroll, tools);
      return editor;
    }

    function createContentBlock(type, index, imageUrl) {
      const block = document.createElement("div");
      block.className = "content-block";
      block.dataset.type = type;

      const removeButton = makeButton("×", "button button-danger remove-block-button", () => block.remove());
      removeButton.setAttribute("aria-label", "Հեռացնել բլոկը");
      removeButton.title = "Հեռացնել";

      if (type === "text") {
        block.classList.add("content-block-text");
        const textarea = document.createElement("textarea");
        textarea.setAttribute("aria-label", "Տեքստի բովանդակություն");
        textarea.placeholder = "Տեքստ";
        block.append(textarea, removeButton);
        return block;
      }

      if (type === "image") {
        block.classList.add("content-block-image");
        block.dataset.url = imageUrl;
        const image = document.createElement("img");
        image.className = "content-block-image-preview";
        image.src = imageUrl;
        image.alt = "Ընտրված պատկեր";
        block.append(image, removeButton);
        return block;
      }

      block.classList.add("content-block-squared");
      removeButton.classList.add("content-block-squared-remove");
      block.append(createSquaredEditor(), removeButton);
      return block;
    }

    function openImagePicker(blocks) {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = "image/*";
      input.hidden = true;
      input.setAttribute("aria-label", "Ընտրել պատկեր");
      document.body.append(input);

      input.addEventListener("cancel", () => input.remove(), { once: true });
      input.addEventListener("change", () => {
        const file = input.files[0];
        input.remove();
        if (!file) return;
        if (!file.type.startsWith("image/")) {
          status.textContent = "Ընտրիր պատկերի ֆայլ։";
          status.className = "status status-error";
          return;
        }

        const reader = new FileReader();
        reader.addEventListener("load", () => {
          if (typeof reader.result !== "string") {
            status.textContent = "Չհաջողվեց կարդալ ընտրված պատկերը։";
            status.className = "status status-error";
            return;
          }
          blocks.append(createContentBlock("image", blocks.children.length, reader.result));
          clearOutput();
        });
        reader.addEventListener("error", () => {
          status.textContent = "Չհաջողվեց կարդալ ընտրված պատկերը։";
          status.className = "status status-error";
        });
        reader.readAsDataURL(file);
      }, { once: true });
      input.click();
    }

    function createContentSection(name, title) {
      const section = document.createElement("section");
      section.className = "content-section";
      section.dataset.section = name;

      const heading = document.createElement("div");
      heading.className = "section-heading";
      const titleElement = document.createElement("h4");
      titleElement.textContent = title;
      heading.append(titleElement);

      const blocks = document.createElement("div");
      blocks.className = "block-list";
      const tools = document.createElement("div");
      tools.className = "add-block-tools";
      tools.append(
        makeButton("Տ", "add-block-button", () => blocks.append(createContentBlock("text", blocks.children.length))),
        makeButton("Պ", "add-block-button", () => openImagePicker(blocks)),
        makeButton("Վ", "add-block-button", () => blocks.append(createContentBlock("squared", blocks.children.length)))
      );
      tools.children[0].setAttribute("aria-label", "Ավելացնել տեքստային բլոկ");
      tools.children[0].title = "Տեքստ";
      tools.children[1].setAttribute("aria-label", "Ավելացնել պատկերի բլոկ");
      tools.children[1].title = "Պատկեր";
      tools.children[2].setAttribute("aria-label", "Ավելացնել վանդակավոր դաշտ");
      tools.children[2].title = "Վանդակավոր դաշտ";
      section.append(heading, blocks, tools);
      return section;
    }

    function createAssignment() {
      const card = document.createElement("article");
      card.className = "assignment-card";

      const heading = document.createElement("div");
      heading.className = "assignment-heading";
      const title = document.createElement("h4");
      title.className = "assignment-number";
      const removeButton = makeButton("×", "button button-danger remove-block-button", () => {
        card.remove();
        updateAssignmentNumbers();
      });
      removeButton.setAttribute("aria-label", "Հեռացնել առաջադրանքը");
      removeButton.title = "Հեռացնել առաջադրանքը";
      heading.append(
        title,
        removeButton
      );

      const sections = document.createElement("div");
      sections.className = "assignment-sections";
      sections.append(
        createContentSection("problem", "Խնդիր"),
        createContentSection("solution", "Լուծում")
      );
      card.append(heading, sections);
      assignmentList.append(card);
      updateAssignmentNumbers();
    }

    function clearOutput(message = "Փոփոխություններ կան․ ստեղծիր և ներբեռնիր JSON-ը։") {
      status.textContent = message;
      status.className = "status";
    }

    function collectBlocks(section) {
      return [...section.querySelector(".block-list").children].map(block => {
        const type = block.dataset.type;
        if (type === "text") {
          return { type, content: block.querySelector("textarea").value };
        }
        if (type === "image") {
          return { type, url: block.dataset.url };
        }
        const content = [...block.querySelectorAll(".grid-row")].map(row =>
          [...row.querySelectorAll("input")].map(cell => cell.value)
        );
        return { type, content };
      });
    }

    function createDocument() {
      const assignments = [...assignmentList.querySelectorAll(".assignment-card")].map(card => {
        const problemSection = card.querySelector('[data-section="problem"]');
        const solutionSection = card.querySelector('[data-section="solution"]');
        return {
          problem: collectBlocks(problemSection),
          solution: collectBlocks(solutionSection)
        };
      });

      return {
        title: form.elements.title.value,
        author: form.elements.author.value,
        "created-at": form.elements["created-at"].value,
        assignments
      };
    }

    form.addEventListener("input", () => clearOutput());
    form.addEventListener("change", () => clearOutput());

    document.querySelector("#add-assignment").addEventListener("click", () => {
      createAssignment();
      clearOutput();
    });

    form.addEventListener("submit", event => {
      event.preventDefault();
      try {
        const documentData = createDocument();
        const file = new Blob([JSON.stringify(documentData, null, 2)], {
          type: "application/json;charset=utf-8"
        });
        const link = document.createElement("a");
        const safeName = documentData.title.trim().replace(/[<>:"/\\|?*\u0000-\u001f]/g, "-") || "workbook";
        link.href = URL.createObjectURL(file);
        link.download = `${safeName}.json`;
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        status.textContent = "JSON փաստաթուղթը ստեղծվեց և ներբեռնվեց։";
        status.className = "status status-success";
      } catch (error) {
        status.textContent = error.message;
        status.className = "status status-error";
      }
    });

    const localDate = new Date();
    const year = localDate.getFullYear();
    const month = String(localDate.getMonth() + 1).padStart(2, "0");
    const day = String(localDate.getDate()).padStart(2, "0");
    form.elements["created-at"].value = `${year}-${month}-${day}`;
    createAssignment();
  </script>
</body>
</html>
