<!doctype html>
<html lang="hy">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f6f9">
    <title>Առաջադրանքների կազմիչ</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        color: #202124;
        background: #f4f6f9;
      }

      * {
        box-sizing: border-box;
      }

      body {
        max-width: 1080px;
        margin: 0 auto;
        padding: 28px 20px 48px;
      }

      h1,
      h2,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 8px;
        font-size: clamp(1.5rem, 3vw, 2rem);
      }

      .intro,
      .status,
      .field-hint {
        color: #5f6368;
        line-height: 1.5;
      }

      .template-picker,
      .task-card,
      .empty-state {
        border: 1px solid #d9dee7;
        border-radius: 10px;
        background: #fff;
      }

      .template-picker {
        display: flex;
        flex-wrap: wrap;
        align-items: end;
        gap: 12px;
        margin: 24px 0;
        padding: 16px;
      }

      label {
        display: grid;
        gap: 6px;
        font-weight: 600;
      }

      select,
      textarea,
      input[type="text"] {
        width: 100%;
        border: 1px solid #aeb6c2;
        border-radius: 6px;
        padding: 9px 10px;
        color: inherit;
        background: white;
        font: inherit;
      }

      select {
        min-width: 210px;
      }

      textarea {
        min-height: 110px;
        resize: vertical;
      }

      button {
        min-height: 38px;
        border: 1px solid #aeb6c2;
        border-radius: 6px;
        padding: 7px 12px;
        background: #fff;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: #f0f4f9;
      }

      button:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      input:focus-visible {
        outline: 2px solid #1769aa;
        outline-offset: 2px;
      }

      button:disabled {
        color: #9299a3;
        cursor: not-allowed;
      }

      .primary-button {
        border-color: #185abc;
        background: #185abc;
        color: white;
      }

      .primary-button:hover:not(:disabled) {
        background: #124a9c;
      }

      .task-list {
        display: grid;
        gap: 16px;
      }

      .task-card {
        padding: 18px;
      }

      .task-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      .task-header h2 {
        margin: 0;
        font-size: 1.125rem;
      }

      .task-actions {
        display: flex;
        gap: 8px;
      }

      .task-fields {
        display: grid;
        gap: 16px;
      }

      .image-field {
        display: grid;
        justify-items: start;
        gap: 8px;
      }

      .image-field input {
        max-width: 100%;
      }

      .image-preview {
        display: block;
        max-width: min(100%, 480px);
        max-height: 320px;
        border: 1px solid #d9dee7;
        border-radius: 6px;
        object-fit: contain;
      }

      .image-preview[hidden] {
        display: none;
      }

      math-grid {
        display: block;
        width: max-content;
        max-width: 100%;
      }

      .grid-scroll {
        max-width: 100%;
        overflow: auto;
        padding: 4px;
        border: 1px solid #d9dee7;
        border-radius: 8px;
        background: #fff;
      }

      .empty-state {
        padding: 24px 18px;
        text-align: center;
      }

      .empty-state p {
        margin-bottom: 0;
        color: #5f6368;
      }

      .status {
        margin-top: 14px;
        margin-bottom: 0;
        font-size: 0.9rem;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 560px) {
        body {
          padding: 20px 12px 36px;
        }

        .template-picker {
          align-items: stretch;
        }

        .template-picker label,
        .template-picker select,
        .template-picker button {
          width: 100%;
        }

        .task-card {
          padding: 14px;
        }
      }
    </style>
    <script type="module" src="../../pensum-editor/src/components/math-grid/math-grid.js"></script>
    <script type="module" src="./teacher.js"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Առաջադրանքների կազմիչ</h1>
        <p class="intro">
          Ավելացրեք տեքստային կամ թվաբանական առաջադրանքներ և դասավորեք դրանք
          ցանկալի հերթականությամբ։
        </p>
      </header>

      <section class="template-picker" aria-label="Առաջադրանքի կաղապարի ավելացում">
        <label for="template-type">
          Առաջադրանքի կաղապար
          <select id="template-type">
            <option value="text">Տեքստային առաջադրանք</option>
            <option value="arithmetic">Թվաբանական առաջադրանք</option>
          </select>
        </label>
        <button id="add-task" class="primary-button" type="button">Ավելացնել առաջադրանքը</button>
      </section>

      <section aria-labelledby="tasks-heading">
        <h2 id="tasks-heading" class="visually-hidden">Առաջադրանքներ</h2>
        <form id="teacher-form" novalidate>
          <div id="task-list" class="task-list" aria-live="polite"></div>
        </form>
        <div id="empty-state" class="empty-state">
          <strong>Առաջադրանքներ դեռ չկան</strong>
          <p>Ընտրեք կաղապարը և ավելացրեք առաջին առաջադրանքը։</p>
        </div>
      </section>

      <p class="status">
        Սա չհրապարակված խմբագրում է․ տվյալները մնում են այս էջում և չեն ուղարկվում
        տվյալների բազա։
      </p>
    </main>
  </body>
</html>
