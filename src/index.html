<!doctype html>
<html lang="hy">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Տնային աշխատանքի տետր</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <form class="editor" id="workbook-form">
      <div class="metadata">
        <div class="field field-full">
          <label class="workbook-title-label" for="workbook-title">Թեմա</label>
          <input id="workbook-title" name="title" type="text" required>
        </div>
        <div class="field field-full">
          <label for="workbook-description">Նկարագրություն</label>
          <textarea id="workbook-description" name="description" rows="4" placeholder="Բացատրություններ, պահանջներ կամ տեսական նյութ"></textarea>
        </div>
      </div>

      <div class="assignments-heading">
        <h3>Առաջադրանքներ</h3>
      </div>
      <div class="assignment-list" id="assignment-list">
        <button class="button button-secondary assignment-action-button add-assignment-button" id="add-assignment" type="button" aria-label="Ավելացնել առաջադրանք" title="Ավելացնել առաջադրանք">
          <img src="./assets/icons/square-plus.svg" alt="" draggable="false">
        </button>
      </div>
      <section class="verification-section" id="verification-section" hidden>
        <label for="workbook-grade">Գնահատական (1-20)</label>
        <input id="workbook-grade" name="grade" type="number" min="1" max="20" step="1">
      </section>
      <p class="status" id="status" aria-live="polite"></p>
    </form>
  </main>

  <dialog class="settings-dialog" id="settings-dialog" aria-labelledby="settings-title">
    <form method="dialog">
      <h2 id="settings-title">Կարգավորումներ</h2>
      <div class="field">
        <label for="user-mode">Օգտվողի ռեժիմ</label>
        <select id="user-mode">
          <option value="teacher">Դասատու</option>
          <option value="student">Սովորող</option>
        </select>
      </div>
      <div class="settings-profile-fields" id="settings-profile-fields">
        <div class="field">
          <label id="profile-name-label" for="profile-name">Դասատուի անուն</label>
          <input id="profile-name" name="profile-name" type="text" autocomplete="name" required>
        </div>
        <div class="field">
          <label id="profile-email-label" for="profile-email">Դասատուի էլ․ փոստ</label>
          <input id="profile-email" name="profile-email" type="email" autocomplete="email" required>
        </div>
      </div>
      <div class="settings-actions">
        <button class="button button-secondary" value="cancel" formnovalidate>Չեղարկել</button>
        <button class="button button-primary" value="save">Պահպանել</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="./main.js"></script>
</body>
</html>
