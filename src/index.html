<!doctype html>
<html lang="hy">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Տնային աշխատանքի տետր</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="toolbar" id="toolbar" role="toolbar" aria-label="Տետրի գործողություններ">
    <div class="toolbar-group">
      <button class="toolbar-button" id="toolbar-create" type="button" aria-label="Ստեղծել նոր տետր" title="Ստեղծել" hidden>
        <img src="./assets/icons/create.png" alt="" draggable="false">
      </button>
      <button class="toolbar-button" id="toolbar-open" type="button" aria-label="Բացել տետր" title="Բացել">
        <img src="./assets/icons/open.png" alt="" draggable="false">
      </button>
    </div>
    <div class="toolbar-group">
      <button class="toolbar-button" id="toolbar-save" type="button" aria-label="Պահպանել տետրը" title="Պահպանել" disabled>
        <img src="./assets/icons/save.png" alt="" draggable="false">
      </button>
      <button class="toolbar-button" id="toolbar-save-as" type="button" aria-label="Պահպանել տետրը որպես նոր ֆայլ" title="Պահպանել որպես…" disabled>
        <img src="./assets/icons/save-as.png" alt="" draggable="false">
      </button>
    </div>
  </header>
  <main>
    <form class="editor" id="workbook-form" hidden>
      <div class="metadata">
        <div class="field field-full">
          <label class="workbook-title-label" for="workbook-title">Թեմա</label>
          <input id="workbook-title" name="title" type="text" required>
        </div>
        <div class="field field-full">
          <label for="workbook-description">Նկարագրություն</label>
          <textarea id="workbook-description" name="description" rows="4" placeholder="Բացատրություններ, պահանջներ կամ տեսական նյութ"></textarea>
        </div>
        <div class="field field-full sender-section" id="sender-section" hidden>
          <span class="field-label">Ուղարկող՝</span>
          <strong class="sender-name" id="sender-name"></strong>
        </div>
      </div>

      <div class="assignments-heading">
        <h3>Առաջադրանքներ</h3>
      </div>
      <div class="assignment-list" id="assignment-list">
        <button class="button button-secondary assignment-action-button add-assignment-button" id="add-assignment" type="button" aria-label="Ավելացնել առաջադրանք" title="Ավելացնել առաջադրանք">
          <img src="./assets/icons/square-plus.svg" alt="" draggable="false">
        </button>
      </div>
      <section class="verification-section" id="verification-section" hidden>
        <span class="field-label" id="rating-label">Գնահատական</span>
        <div class="rating-picker" id="rating-picker" role="radiogroup" aria-labelledby="rating-label">
          <button type="button" role="radio" aria-checked="false" data-emoji="😟" title="Պետք է աշխատել">😟</button>
          <button type="button" role="radio" aria-checked="false" data-emoji="😐" title="Բավարար">😐</button>
          <button type="button" role="radio" aria-checked="false" data-emoji="🙂" title="Լավ">🙂</button>
          <button type="button" role="radio" aria-checked="false" data-emoji="😊" title="Շատ լավ">😊</button>
          <button type="button" role="radio" aria-checked="false" data-emoji="🤩" title="Գերազանց">🤩</button>
        </div>
      </section>
    </form>
    <p class="status" id="status" aria-live="polite"></p>
  </main>

  <dialog class="settings-dialog" id="settings-dialog" aria-labelledby="settings-title">
    <form method="dialog">
      <h2 id="settings-title">Կարգավորումներ</h2>
      <div class="field">
        <label for="user-mode">Օգտվող</label>
        <select id="user-mode">
          <option value="teacher">Դասատու</option>
          <option value="student">Սովորող</option>
        </select>
      </div>
      <div class="settings-profile-fields" id="settings-profile-fields">
        <div class="field">
          <label id="profile-name-label" for="profile-name">Անուն և ազգանուն</label>
          <input id="profile-name" name="profile-name" type="text" autocomplete="name" required>
        </div>
        <div class="field" id="profile-class-field" hidden>
          <label for="profile-class">Դասարան</label>
          <input id="profile-class" name="profile-class" type="text" autocomplete="off">
        </div>
        <div class="field">
          <label id="profile-email-label" for="profile-email">Էլ․ փոստ</label>
          <input id="profile-email" name="profile-email" type="email" autocomplete="email" required>
        </div>
      </div>
      <div class="settings-actions">
        <button class="button button-secondary" value="cancel" formnovalidate>Չեղարկել</button>
        <button class="button button-primary" value="save">Պահպանել</button>
      </div>
    </form>
  </dialog>

  <dialog class="settings-dialog" id="about-dialog" aria-labelledby="about-title">
    <form method="dialog">
      <h2 id="about-title">Տնային աշխատանք</h2>
      <p>Տարբերակ՝ <span id="about-version"></span></p>
      <p>Տնային աշխատանքների տետրեր կազմելու, լրացնելու և ստուգելու հավելված։</p>
      <p><small>© Արմեն Բադալյան, 2026</small></p>
      <div class="settings-actions">
        <button class="button button-primary" value="close">Փակել</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="./main.js"></script>
</body>
</html>
